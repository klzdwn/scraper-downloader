<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALZ Media Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { margin-bottom: 8px; font-size: 24px; color: #38bdf8; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 12px; outline: none; font-size: 14px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    #result { margin-top: 20px; font-size: 14px; text-align: left; background: #0f172a; padding: 15px; border-radius: 8px; word-break: break-all; max-height: 250px; overflow-y: auto; }
    a { color: #38bdf8; text-decoration: none; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>KALZ Downloader</h1>
    <p>Download video/media TikTok & Instagram</p>
    
    <input type="text" id="urlInput" placeholder="Paste link TikTok / Instagram di sini...">
    <button onclick="downloadMedia()">Download</button>

    <div id="result" style="display:none;"></div>
  </div>

  <script>
    async function downloadMedia() {
      const url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!url) return alert("Masukkan link dulu!");

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<i>Sedang memproses media... (Bila pertama kali dibuka butuh ~30 detik)</i>';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (data.success) {
          resultDiv.innerHTML = `<pre style="white-space: pre-wrap;">${JSON.stringify(data.data, null, 2)}</pre>`;
        } else {
          resultDiv.innerHTML = '<span style="color:#ef4444;">Gagal: ' + (data.error || 'Link tidak valid/terjadi error') + '</span>';
        }
      } catch (e) {
        resultDiv.innerHTML = '<span style="color:#ef4444;">Error koneksi ke server.</span>';
      }
    }
  </script>
</body>
</html>
