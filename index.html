<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALZ Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: #0b1120; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 24px; color: #38bdf8; margin-bottom: 6px; font-weight: 700; }
    p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 12px; outline: none; font-size: 14px; }
    input:focus { border-color: #38bdf8; }
    button#btnSubmit { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 15px; }
    button#btnSubmit:hover { background: #0369a1; }
    button#btnSubmit:disabled { background: #334155; cursor: not-allowed; }
    
    /* Result Box Styling */
    #result { margin-top: 20px; display: none; background: #0f172a; border-radius: 12px; border: 1px solid #334155; padding: 16px; text-align: center; }
    .media-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #e2e8f0; line-height: 1.4; word-break: break-word; }
    
    .media-item { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #1e293b; }
    .media-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    
    .media-preview { width: 100%; max-height: 380px; border-radius: 10px; margin-bottom: 12px; background: #000; object-fit: contain; }
    
    .btn-download { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background 0.2s; }
    .btn-download:hover { background: #16a34a; }
    
    .error-msg { color: #f87171; font-size: 14px; }
    .loading-msg { color: #38bdf8; font-size: 14px; font-style: italic; }
  </style>
</head>
<body>
  <div class="card">
    <h1>KALZ Downloader</h1>
    <p class="subtitle">Download video/media TikTok & Instagram</p>

    <input type="text" id="urlInput" placeholder="Paste link di sini...">
    <button id="btnSubmit" onclick="downloadMedia()">Download</button>

    <div id="result"></div>
  </div>

  <script>
    async function downloadMedia() {
      const url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      const btnSubmit = document.getElementById('btnSubmit');

      if (!url) {
        alert("Masukkan link terlebih dahulu!");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Memproses...";
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<span class="loading-msg">Mengekstrak media...</span>';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const json = await res.json();

        if (json.success) {
          const data = json.data;
          const title = data.title || data.caption || 'Instagram / Media Download';
          
          let items = [];

          // 1. Ekstrak dari array 'downloads' jika ada
          if (Array.isArray(data.downloads) && data.downloads.length > 0) {
            items = data.downloads.map(item => ({
              type: item.type || (item.url && item.url.includes('.mp4') ? 'video' : 'image'),
              url: item.url,
              thumbnail: item.thumbnail
            }));
          } 
          // 2. Fallback jika strukturnya langsung url/video/nowm
          else {
            let mediaUrl = data.url || data.video || data.nowm;
            if (Array.isArray(mediaUrl)) mediaUrl = mediaUrl[0];
            if (typeof mediaUrl === 'object' && mediaUrl.url) mediaUrl = mediaUrl.url;

            if (mediaUrl) {
              items.push({
                type: (typeof mediaUrl === 'string' && mediaUrl.includes('.mp4')) ? 'video' : 'video',
                url: mediaUrl,
                thumbnail: data.thumbnail || data.cover || ''
              });
            }
          }

          if (items.length === 0) {
            resultDiv.innerHTML = `<span class="error-msg">Media tidak ditemukan dalam link ini.</span>`;
            return;
          }

          let html = `<div class="media-title">${title}</div>`;

          items.forEach((item, index) => {
            html += `<div class="media-item">`;
            
            // Render Player Video atau Image
            if (item.type === 'video') {
              html += `
                <video class="media-preview" controls poster="${item.thumbnail || ''}">
                  <source src="${item.url}" type="video/mp4">
                  Browser Anda tidak mendukung pemutar video.
                </video>
                <a href="${item.url}" target="_blank" download rel="noopener" class="btn-download">
                  📥 Download Video ${items.length > 1 ? `#${index + 1}` : ''}
                </a>
              `;
            } else {
              html += `
                <img src="${item.url || item.thumbnail}" class="media-preview" alt="Preview Image">
                <a href="${item.url || item.thumbnail}" target="_blank" download rel="noopener" class="btn-download">
                  📥 Download Gambar ${items.length > 1 ? `#${index + 1}` : ''}
                </a>
              `;
            }

            html += `</div>`;
          });

          resultDiv.innerHTML = html;
        } else {
          resultDiv.innerHTML = `<span class="error-msg">Gagal: ${json.error || 'Gagal memproses link'}</span>`;
        }
      } catch (err) {
        resultDiv.innerHTML = '<span class="error-msg">Terjadi kesalahan koneksi server.</span>';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Download";
      }
    }
  </script>
</body>
</html>
