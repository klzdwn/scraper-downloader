<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALZ Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: #0b1120; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 24px; color: #38bdf8; margin-bottom: 6px; font-weight: 700; }
    p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 12px; outline: none; font-size: 14px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 15px; }
    button:hover { background: #0369a1; }
    
    /* Result Box Styling */
    #result { margin-top: 20px; display: none; background: #0f172a; border-radius: 12px; border: 1px solid #334155; padding: 16px; text-align: center; }
    .thumb-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
    .media-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #e2e8f0; line-height: 1.4; word-break: break-word; }
    
    .btn-download { display: inline-block; width: 100%; padding: 12px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; margin-top: 6px; }
    .btn-download:hover { background: #16a34a; }
    .error-msg { color: #f87171; font-size: 14px; }
    .loading-msg { color: #38bdf8; font-size: 14px; font-style: italic; }
  </style>
</head>
<body>
  <div class="card">
    <h1>KALZ Downloader</h1>
    <p class="subtitle">Download video/media TikTok & Instagram</p>

    <input type="text" id="urlInput" placeholder="Paste link di sini...">
    <button id="btnSubmit" onclick="downloadMedia()">Download</button>

    <div id="result"></div>
  </div>

  <script>
    async function downloadMedia() {
      const url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      const btnSubmit = document.getElementById('btnSubmit');

      if (!url) {
        alert("Masukkan link terlebih dahulu!");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Memproses...";
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<span class="loading-msg">Mengekstrak media...</span>';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const json = await res.json();

        if (json.success) {
          const data = json.data;

          // Ambil thumbnail & link download dari berbagai struktur response
          const thumbnail = data.thumbnail || data.cover || (data.url && data.url[0]) || '';
          const title = data.title || data.caption || 'Media Download';
          
          // Cari URL video/media
          let downloadUrl = '';
          if (typeof data.url === 'string') downloadUrl = data.url;
          else if (Array.isArray(data.url) && data.url.length > 0) downloadUrl = typeof data.url[0] === 'string' ? data.url[0] : data.url[0].url;
          else if (data.video) downloadUrl = Array.isArray(data.video) ? data.video[0] : data.video;
          else if (data.nowm) downloadUrl = data.nowm;

          let html = '';
          if (thumbnail) {
            html += `<img src="${thumbnail}" class="thumb-img" alt="Thumbnail">`;
          }
          html += `<div class="media-title">${title}</div>`;

          if (downloadUrl) {
            html += `<a href="${downloadUrl}" target="_blank" rel="noopener" class="btn-download"> Klik Untuk Unduh Media 🚀</a>`;
          } else {
            // Jika struktur JSON unik, berikan tombol lihat JSON
            html += `<pre style="text-align:left; font-size:11px; color:#a7f3d0; overflow-x:auto;">${JSON.stringify(data, null, 2)}</pre>`;
          }

          resultDiv.innerHTML = html;
        } else {
          resultDiv.innerHTML = `<span class="error-msg">Gagal: ${json.error || 'Gagal memproses link'}</span>`;
        }
      } catch (err) {
        resultDiv.innerHTML = '<span class="error-msg">Terjadi kesalahan koneksi server.</span>';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Download";
      }
    }
  </script>
</body>
</html>
